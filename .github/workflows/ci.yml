name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          # Mathlib oleans still come from lake exe cache get. The GitHub
          # cache can restore a previous SHA's .lake/build and hide a
          # broken project glob (as happened on PR #7).
          use-github-cache: false

  examples:
    name: lake build Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: Examples
          test: false
          lint: false
          use-github-cache: false
